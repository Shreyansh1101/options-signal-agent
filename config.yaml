# ─────────────────────────────────────────────────────────────
#  Options Signal Agent — settings
#  You can edit this file right on GitHub (pencil icon) from your phone.
#  Changes take effect on the next run (within ~5 minutes).
# ─────────────────────────────────────────────────────────────

# What to watch
universe:
  always_watch: [SPY, QQQ, IWM]      # always scanned
  watchlist: []                      # add your own, e.g. [AAPL, NVDA, TSLA]
  scanner_most_active: 25            # top N most-active stocks (by volume) from Alpaca's screener
  scanner_movers: 15                 # top N gainers + top N losers
  max_symbols: 30                    # cap per scan (keeps runs fast and inside free API limits)
  min_price: 10                      # skip stocks below this (options too thin / wide)
  max_price: 1500
  # leveraged / inverse ETFs — options on these are poor fits for these signals
  exclude: [TQQQ, SQQQ, SOXL, SOXS, UVXY, UVIX, SVXY, VXX, TSLL, TSLZ, TSLQ, TSLT, NVDL, NVDS, NVDX, NVDU, NVDD, NVDQ, SPXL, SPXS, SPXU, SDS, SSO, UPRO, QLD, QID, TNA, TZA, LABU, LABD, FNGU, FNGD, BITX, BITU, SBIT, MSTU, MSTZ, MSTX, CONL, AMDL, PLTU, METU, AAPU, GGLL, AMZU, MSFU, SNXX, YINN, YANG, NUGT, DUST, JNUG, JDST, BOIL, KOLD, UCO, SCO, TMF, TMV, ETHU]

# When new BUY signals are allowed (New York time)
trading_window:
  start: "09:45"                     # skip the chaotic first 15 minutes
  end: "15:30"                       # no new entries in the last 30 minutes

# How signals are scored (each part is -1 … +1; + = bullish, - = bearish)
scoring:
  chart_weight: 0.6
  news_weight: 0.4
  no_news_factor: 0.85               # with no recent news, the chart alone must be stronger
  entry_threshold: 0.55              # |score| needed for a BUY CALL (+) or BUY PUT (-)
  confirm_cycles: 2                  # score must clear the bar on this many scans in a row
  news_veto: 0.25                    # block a trade if news points the other way by more than this
  min_relative_volume: 1.0           # recent volume vs normal for that time of day
  market_filter: true                # penalise trades that fight a strong SPY trend
  news_lookback_hours: 24
  news_half_life_hours: 6            # older headlines count less

# Which option contract to suggest
contracts:
  min_days_to_expiry: 3              # no 0–2 DTE lottery tickets by default
  target_days_to_expiry: 10
  max_days_to_expiry: 30
  min_delta: 0.35
  max_delta: 0.65
  max_spread_pct: 0.12               # (ask - bid) / mid
  min_premium: 0.30                  # per share
  max_premium: 10.00                 # per share  (1 contract = 100 shares → $1,000)

# Risk plan attached to every signal
risk:
  risk_per_trade_usd: 100            # how much you're willing to lose per trade → sets suggested contract count
  stop_loss_pct: 0.35                # SELL if the option loses 35%
  take_profit_pct: 0.60              # SELL if the option gains 60%
  breakeven_after_pct: 0.30          # once up 30%, the stop moves to your entry price
  flip_exit_score: 0.35              # SELL if the score flips this far the other way
  max_hold_days: 5                   # SELL after this many trading days regardless
  max_open_signals: 5
  cooldown_minutes: 90               # don't re-signal the same stock too quickly

# Claude scores stock headlines instead of the built-in keyword model (uses the key you connected
# with 'claude <key>'; costs well under $1/month). Falls back to the keyword model if anything fails.
claude_news:
  enabled: true
  model: claude-haiku-5-5

# Live mode (always-on server): streams prices + news and re-scores every minute
live:
  confirm_cycles: 3                  # in live mode a "cycle" is 1 minute → 3 = signal must hold for 3 minutes
  rescan_on_news: true               # breaking headline on a watched stock → re-score within seconds
  morning_check: true                # 9:20 AM "ready for the open" notification

# ─────────────────────────────────────────────────────────────
#  Kalshi prediction-market signals (read-only — you place trades in the Kalshi app)
# ─────────────────────────────────────────────────────────────
kalshi:
  enabled: true
  categories: [Economics, Politics, Elections, World, Sports]   # for the Claude news forecasts
  max_pages: 40                      # how much of Kalshi's market list to scan (1,000 markets per page)

  index:                             # S&P 500 / Nasdaq-100 fair-value model (free, no AI)
    enabled: true
    series: {KXINX: SPY, KXINXU: SPY, KXINXI: SPY, KXNASDAQ100: QQQ, KXNASDAQ100U: QQQ, KXNASDAQ100I: QQQ}
    ratio_series: {SPY: KXINX, QQQ: KXNASDAQ100}     # daily series whose settlement calibrates index ÷ ETF
    ratio_bounds: {SPY: [9.0, 11.5], QQQ: [35, 50]}
    min_edge: 0.06                   # dollars per contract after fees (6¢)
    min_minutes_left: 20
    max_trading_minutes: 1170        # up to ~3 trading days ahead
    max_spread: 0.06
    min_size: 5
    tail_factor: 1.15                # widen volatility so tails aren't under-priced

  news:                              # Claude reads the news (web search) and estimates the odds
    enabled: true
    model: claude-haiku-5-5
    web_search: true
    max_analyses_per_day: 8          # ≈ 1–4¢ each → caps spend at roughly $0.30/day
    min_edge: 0.06
    shrink: {high: 0.6, medium: 0.4, low: 0.0}   # how far to trust Claude vs the market price
    min_volume_24h: 500
    max_spread: 0.05
    min_hours_to_close: 2
    max_days_to_close: 30
    sports_max_days: 3
    reanalyze_hours: 12
    reanalyze_move: 0.06

  mispricing:
    enabled: true
    min_profit: 0.02                 # per set of contracts, after fees
    min_size: 10

  risk:
    risk_per_trade_usd: 25           # max you'd lose per signal (sets the contract count)
    max_contracts: 100
    max_open: 6
    take_profit: 0.20                # sell when up 20¢ per contract
    stop_loss: 0.25                  # sell when down 25¢ per contract
    thesis_stop: 0.08                # sell if fair value drops 8¢ below your entry
    cooldown_minutes: 120

notifications:
  daily_summary: true                # end-of-day recap + running track record
  quiet_skips: true                  # don't notify when a signal was found but no good contract existed
