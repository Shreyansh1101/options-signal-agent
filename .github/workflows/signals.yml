name: Options signals

on:
  schedule:
    # Every 5 minutes, Mon–Fri, 13:00–21:55 UTC (covers 9:30–4:00 New York time all year).
    # The agent checks Alpaca's market clock and exits in seconds when the market is closed.
    - cron: "*/5 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options: [scan, test-notification, status, backtest]
        default: test-notification
      backtest_days:
        description: "Backtest: how many past days"
        default: "60"
      backtest_symbols:
        description: "Backtest: symbols (comma separated, blank = defaults)"
        default: ""

permissions:
  contents: write   # only used by the keep-alive step below

concurrency:
  group: options-signals
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore saved state (open signals, history)
        uses: actions/cache/restore@v4
        with:
          path: state/state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Run agent
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BACKTEST_DAYS: ${{ inputs.backtest_days }}
          BACKTEST_SYMBOLS: ${{ inputs.backtest_symbols }}
        run: python -m signal_agent ${{ inputs.mode || 'scan' }}

      - name: Save state
        if: always() && hashFiles('state/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state/state.json
          key: state-${{ github.run_id }}-${{ github.run_attempt }}

      # GitHub pauses scheduled workflows after 60 days without a commit. This makes an empty
      # commit every ~45 days so the agent keeps running.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( ( $(date +%s) - last ) / 86400 )) -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keep-alive"
            git push
          fi
