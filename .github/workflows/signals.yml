name: Backtest & checks

# The live agent runs on your always-on server (see README). This workflow is only for
# on-demand jobs you start from your phone: Actions → "Backtest & checks" → Run workflow.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options: [backtest, test-notification]
        default: backtest
      backtest_days:
        description: "Backtest: how many past days"
        default: "60"
      backtest_symbols:
        description: "Backtest: symbols (comma separated, blank = defaults)"
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Offline tests
        run: python -m unittest discover -s tests
      - name: Run
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BACKTEST_DAYS: ${{ inputs.backtest_days }}
          BACKTEST_SYMBOLS: ${{ inputs.backtest_symbols }}
        run: python -m signal_agent ${{ inputs.mode }}
